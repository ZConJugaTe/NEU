    <script>
        let tapeusage=0;
        let stepCount = 0; // 步数计数器
        function selectPresetItems() {
            const presetSelect = document.getElementById('presetItems');
            const itemsInput = document.getElementById('itemsInput');
            itemsInput.value = presetSelect.value; // 设置输入框的内容为选择的预设组合
        }

        function simulate() {
            const itemsInput = document.getElementById('itemsInput').value.split(';').map(item => {
                const parts = item.split(',');
                return { weight: parseInt(parts[0]), value: parseInt(parts[1]) };
            });
            const capacity = parseInt(document.getElementById('capacityInput').value);

            // 传入物品数量、背包容量和物品数组
            initializeTape(itemsInput.length, capacity, itemsInput);

            fetch('/solve_knapsack', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({items: itemsInput, capacity: capacity})
            })
            .then(response => response.json())
            .then(data => {
                const steps = data.steps;
                const optimalSolution = data.optimalSolution;
                const maxProfit = data.maxProfit;

                animateSteps(steps, itemsInput, capacity, maxProfit, optimalSolution);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('处理请求时发生错误，请稍后再试。');
            });
            performKnapsack();
        }

function animateSteps(steps, items, capacity, maxProfit, optimalSolution) {
    let stepIndex = 0;
    stepCount = 0; // 重置步数计数器
    const stepsDiv = document.getElementById('steps');
    const resultsDiv = document.getElementById('results');
    const resultsolveDiv = document.getElementById('resultsolve');
    const tapeDiv = document.getElementById('tape');
    const machineState = document.getElementById('machineState');
    const taperesultDiv = document.getElementById('taperesult');
    const tapenumber = document.getElementById('tapenumber');
    const paceNumber = document.getElementById('pace_number'); // 步数显示元素

    stepsDiv.innerHTML = '';
    taperesultDiv.innerHTML = '';  // 初始化工作纸带内容

    stepsDiv.innerHTML += `<p>状态: q0 开始状态</p>`;
    stepIndex++;  // 移动到下一个步骤
    stepCount++; // 增加步数计数
    // 初始化高亮显示物品数量和背包容量
    function highlightInitial() {
        const tapeCells = tapeDiv.querySelectorAll('.tape-cell');

        // 首先高亮显示物品数量
        tapeCells[0].style.backgroundColor = '#4CAF50';
        stepsDiv.innerHTML += `<p>状态: q0->q1 读取物品数量</p>`;
        stepIndex++;  // 移动到下一个步骤
        stepCount++; // 增加步数计数
        setTimeout(() => {
            // 移除物品数量的高亮
            tapeCells[0].style.backgroundColor = '';
            stepsDiv.innerHTML += `<p>状态: q1->q2 读取背包容量</p>`;
            stepIndex++;  // 移动到下一个步骤
            stepCount++; // 增加步数计数
            // 然后高亮显示背包容量
            tapeCells[1].style.backgroundColor = '#4CAF50';

            setTimeout(() => {
                // 移除背包容量的高亮
                tapeCells[1].style.backgroundColor = '';
                stepsDiv.innerHTML += `<p>状态: q2->q3 开始求解问题</p>`;
                stepIndex++;  // 移动到下一个步骤
                stepCount++; // 增加步数计数
                // 开始处理其他步骤
                processStep();
            }, 1000);  // 保持背包容量的高亮1秒
        }, 1000);  // 保持物品数量的高亮1秒

    }

    function processStep() {
        if (stepIndex < steps.length) {
            const step = steps[stepIndex];
            const tapeCells = tapeDiv.querySelectorAll('.tape-cell');

            // 重置所有背景色
            tapeCells.forEach(cell => cell.style.backgroundColor = '');

            // 逐个物品高亮显示
            let currentHighlightIndex = 0;
            function highlightNextItem() {
                if (currentHighlightIndex < step.contains.length) {
                    const itemIndex = step.contains[currentHighlightIndex];
                    const baseIndex = itemIndex * 2 + 2; // 每个物品有两个单元格，一个重量和一个价值
                    tapeCells[baseIndex].style.backgroundColor = '#4CAF50'; // 高亮显示重量
                    tapeCells[baseIndex + 1].style.backgroundColor = '#4CAF50'; // 高亮显示价值
                    currentHighlightIndex++;
                    setTimeout(highlightNextItem, 500); // 控制每个物品高亮的时间间隔
                } else {
                    setTimeout(() => {
                        tapeCells.forEach(cell => cell.style.backgroundColor = ''); // 消除所有高亮
                        updateStepInfo(); // 更新步骤信息
                    }, 500); // 保持最后一个物品高亮显示的时间，然后消除高亮
                }
            }

            function updateStepInfo() {
                const newResultSpan = document.createElement('span');
                const readWriteHead = document.getElementById('readWriteHead') || createReadWriteHead(taperesultDiv);
                const existingHighlights = taperesultDiv.querySelectorAll('.highlight');
                    existingHighlights.forEach(cell => {
                        cell.classList.remove('highlight');
                        cell.style.backgroundColor = '';
                    });
                    newResultSpan.textContent = step.profit;
                    styleCell_1(newResultSpan);
                    newResultSpan.classList.add('highlight');
                    taperesultDiv.appendChild(newResultSpan);
                    newResultSpan.style.opacity = '0';
                    tapeusage++;
                    tapenumber.innerHTML = `纸带使用总空间:${tapeusage}`;
                    // 更新读写头的位置
                    readWriteHead.style.left = `${newResultSpan.offsetLeft}px`;

                setTimeout(() => { // 延迟1秒后更新信息，确保高亮显示已完成
                    taperesultDiv.scrollLeft = taperesultDiv.scrollWidth - taperesultDiv.clientWidth;
                    newResultSpan.style.opacity = '1';

                    stepsDiv.innerHTML += `<p>${step.action} 第 ${step.level} 层级: 从状态 ${step.state} 到 ${step.next_state} 转移, 更新价值 ${step.profit}, 物品组合: [${step.contains.map(i => `物品${i}`).join(', ')}]</p>`;
                    machineState.innerHTML = `<p>当前所处状态: ${step.next_state}</p>`;
                    stepIndex++;  // 移动到下一个步骤
                    stepCount++; // 增加步数计数
                    paceNumber.innerHTML = `步数: ${stepCount}`; // 更新步数显示
                    setTimeout(processStep, 1000);  // 继续处理下一步
                }, 1000);
            }

            highlightNextItem(); // 开始逐个高亮显示
        } else {
            resultsDiv.innerHTML = `<p>最大价值: ${maxProfit}</p>`;
            resultsolveDiv.innerHTML = `<p>最优物品组合: ${optimalSolution.map(i => `物品${i}`).join(', ')}</p>`;
            updateTapeInterval(optimalSolution, items.length);
        }
    }

    highlightInitial(); // 开始处理步骤
}


function updateTapeInterval(optimalSolution, totalItems) {
    const tapeInterval = document.getElementById('tapeInterval');
    tapeInterval.innerHTML = ''; // 清空现有内容

    const selectionArray = new Array(totalItems).fill(0);
    optimalSolution.forEach(index => {
        selectionArray[index] = 1; // 标记选择的物品，注意确保索引对应
    });

    // 遍历每个元素，为每个选择创建一个单元格
    selectionArray.forEach(value => {
        const cell = document.createElement('span');
        cell.textContent = value;
        cell.style.padding = '0 10px';  // 调整内边距以便于阅读
        cell.style.width = '30px';  // 设置宽度
        cell.style.height = '30px';  // 设置高度
        cell.style.display = 'inline-flex';  // 使用flex布局
        cell.style.alignItems = 'center';  // 垂直居中
        cell.style.justifyContent = 'center';  // 水平居中
        cell.style.marginRight = '5px';  // 右侧间隔
        cell.style.backgroundColor = value === 1 ? '#4CAF50' : '#fff';  // 设置背景色
        cell.style.color = value === 1 ? '#fff' : '#333';  // 设置文字颜色
        cell.style.border = '1px solid #ccc';  // 设置边框

        tapeInterval.appendChild(cell); // 将单元格添加到tapeInterval中
    });
}

function styleCell_1(cell) {
    cell.style.padding = '2px 5px';
    cell.style.margin = '0 2px';
    cell.style.border = '1px solid #ccc';
    cell.style.minWidth = '30px';
    cell.style.textAlign = 'center';
}

function initializeTape(itemCount, capacity, items) {
    stepCount=0;
    const pacenumber=document.getElementById('pace_number');
    pacenumber.innerHTML='';

    const tape = document.getElementById('tape');
    tape.innerHTML = '';

    const taperesult = document.getElementById('taperesult');
    taperesult.innerHTML = '';

    const tapeinterval = document.getElementById('tapeInterval');
    tapeinterval.innerHTML = '';

    const tapenumber = document.getElementById('tapenumber');
    tapeusage = 2 + 2 * itemCount;
    tapenumber.innerHTML = `纸带使用总空间:${tapeusage}`;
    // 首先添加物品数量和背包容量
    tape.innerHTML += `
        <span class="tape-cell weight"
        style="padding: 0 10px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; margin-right: 5px; color: #333; border: 1px solid #ccc;">
            ${itemCount}
        </span>
        <span class="tape-cell weight"
        style="padding: 0 10px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; margin-right: 5px; color: #333; border: 1px solid #ccc;">
            ${capacity}
        </span>`;

    // 然后添加物品的重量和价值
    tape.innerHTML += items.flatMap(item => [
        `<span class="tape-cell weight"
        style="padding: 0 10px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; margin-right: 5px; color: #333; border: 1px solid #ccc;">${item.weight}</span>`,
        `<span class="tape-cell value"
        style="padding: 0 10px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; margin-right: 5px; color: #333; border: 1px solid #ccc;">${item.value}</span>`
    ]).join('');

    createReadWriteHead(document.getElementById('taperesult')); // 确保读写头存在
}
function createReadWriteHead(tapeResult) {
    const head = document.createElement('div');
    head.id = 'readWriteHead';
    head.style.position = 'absolute';
    head.style.left = '0'; // 初始化位置在容器的起始处
    head.style.top = '0';
    head.style.width = '30px'; // 读写头的宽度
    head.style.height = '100%'; // 读写头的高度
    head.style.backgroundColor = '#4CAF50'; // 读写头的颜色，可以根据需要修改
    head.style.transition = 'left 1s ease'; // 添加平滑过渡动画
    tapeResult.appendChild(head);
    return head;
}

function branchAndBoundKnapsack(items, capacity) {
    let maxProfit = 0;
    let bestItems = [];
    let treeData = [];
    let nodeId = 0;
    let pq = [];
    let nodeCount = 0;

    function bound(weight, profit, items, level, capacity) {
        let j = level;
        let totWeight = weight;
        let profitBound = profit;
        while (j < items.length && totWeight + items[j].weight <= capacity) {
            totWeight += items[j].weight;
            profitBound += items[j].value;
            j++;
        }
        if (j < items.length) {
            profitBound += (capacity - totWeight) * (items[j].value / items[j].weight);
        }
        return profitBound;
    }

    pq.push({ level: -1, weight: 0, profit: 0, itemsTaken: [], parent: "root", id: `node${nodeId}`, nodeOrder: nodeCount++, pruned: false });
    treeData.push({ id: `node${nodeId}`, name: "根节点", parent: null, profit: 0, weight: 0, order: 0, pruned: false });

    while (pq.length > 0) {
        pq.sort((a, b) => b.bound - a.bound);
        let node = pq.shift();

        let level = node.level + 1;
        if (level < items.length) {
            let includeWeight = node.weight + items[level].weight;
            let includeProfit = node.profit + items[level].value;
            let nextId = ++nodeId;

            if (includeWeight <= capacity) {
                let includeBound = bound(includeWeight, includeProfit, items, level + 1, capacity);
                if (includeBound > maxProfit) {
                    let includeNode = { level: level, weight: includeWeight, profit: includeProfit, itemsTaken: node.itemsTaken.concat(`node${nextId}`), parent: node.id, id: `node${nextId}`, bound: includeBound, nodeOrder: nodeCount++, pruned: false };
                    pq.push(includeNode);
                    treeData.push({ id: `node${nextId}`, name: `包含物品${level}`, parent: node.id, profit: includeProfit, weight: includeWeight, order: includeNode.nodeOrder, pruned: false });
                    if (includeProfit > maxProfit) {
                        maxProfit = includeProfit;
                        bestItems = includeNode.itemsTaken.slice();
                    }
                } else {
                    treeData.push({ id: `node${nextId}`, name: `剪枝: 包含物品${level} (上界: ${includeBound})`, parent: node.id, profit: includeProfit, weight: includeWeight, order: nodeCount++, pruned: true, pruneReason: '上界小于最大利润' });
                }
            } else {
                treeData.push({ id: `node${nextId}`, name: `剪枝: 包含物品${level} (超出容量)`, parent: node.id, profit: includeProfit, weight: includeWeight, order: nodeCount++, pruned: true, pruneReason: '超出容量' });
            }

            nextId = ++nodeId;
            let excludeBound = bound(node.weight, node.profit, items, level + 1, capacity);
            if (excludeBound > maxProfit) {
                let excludeNode = { level: level, weight: node.weight, profit: node.profit, itemsTaken: node.itemsTaken, parent: node.id, id: `node${nextId}`, bound: excludeBound, nodeOrder: nodeCount++, pruned: false };
                pq.push(excludeNode);
                treeData.push({ id: `node${nextId}`, name: `不包含物品${level}`, parent: node.id, profit: node.profit, weight: node.weight, order: excludeNode.nodeOrder, pruned: false });
            } else {
                treeData.push({ id: `node${nextId}`, name: `剪枝: 不包含物品${level} (上界: ${excludeBound})`, parent: node.id, profit: node.profit, weight: node.weight, order: nodeCount++, pruned: true, pruneReason: '上界小于最大利润' });
            }
        }
    }

    return { treeData, maxProfit, bestItems };
}

function updateVisualization(treeData) {
    const margin = { top: 50, right: 120, bottom: 50, left: 150 };
    const width = 960 - margin.right - margin.left;
    const height = 600 - margin.top - margin.bottom;

    // 清空SVG并重新设置宽高
    const svg = d3.select("#svgContainer svg").html("")
        .attr("width", width + margin.right + margin.left)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    const root = d3.stratify()
        .id(d => d.id)
        .parentId(d => d.parent)(treeData);

    const treeLayout = d3.tree().size([height, width]);
    treeLayout(root);

    // 生成路径生成器
    const linkPathGenerator = d3.linkHorizontal()
        .x(d => d.y)
        .y(d => d.x);

    // 绘制连线
    svg.selectAll(".link")
        .data(root.links())
        .enter().append("path")
        .attr("class", "link")
        .attr("d", linkPathGenerator)
        .attr("stroke", "#ccc")
        .attr("fill", "none")
        .attr("stroke-opacity", 0); // 初始化时隐藏所有连线

    // 绘制节点
    const nodes = svg.selectAll(".node")
        .data(root.descendants())
        .enter().append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.y},${d.x})`);

    nodes.append("circle")
        .attr("r", 10)
        .attr("fill", d => d.data.pruned ? "#f00" : "#fff")
        .attr("stroke", "steelblue")
        .attr("stroke-opacity", 0)    // 最初设置边框不可见
        .attr("fill-opacity", d => d.data.id === "root" ? 1 : 0); // 仅根节点初始可见

    nodes.append("text")
        .attr("dy", ".35em")
        .attr("x", d => d.children ? -15 : 15)
        .attr("text-anchor", d => d.children ? "end" : "start")
        .style("font-size", "10px")
        .text(d => `#${d.data.order} - ${d.data.name} (价值: ${d.data.profit}, 重量: ${d.data.weight})`)
        .style("fill", d => d.data.pruned ? "#f00" : "black")
        .attr("fill-opacity", d => d.data.id === "root" ? 1 : 0); // 仅根节点文本初始可见

    // 动画显示函数
    function revealElements() {
    // 重置所有元素的可见性
    svg.selectAll(".link")
        .attr("stroke-opacity", 0);

    svg.selectAll(".node circle")
        .attr("fill-opacity", 0)
        .attr("stroke-opacity", 0);

    svg.selectAll(".node text")
        .attr("fill-opacity", 0);

    let delayIncrement = 200; // 每个元素之间的延迟时间

    // 遍历所有连接线，并按目标节点的顺序显示
    svg.selectAll(".link")
        .transition()
        .duration(200)
        .delay((d) => (d.target.data.order * delayIncrement * 3)) // 使用目标节点的 order 属性计算延迟
        .attr("stroke-opacity", 1);

    // 遍历所有节点
    svg.selectAll(".node")
        .each(function (d) {
            let node = d3.select(this);
            let circle = node.select("circle");
            let text = node.select("text");

            // 显示节点圆圈动画
            circle.transition()
                .duration(500)
                .delay(d.data.order * delayIncrement * 3 + delayIncrement) // 使用节点的 order 属性计算延迟
                .attr("fill-opacity", 1)
                .attr("stroke-opacity", 1);

            // 显示文本动画
            text.transition()
                .duration(500)
                .delay(d.data.order * delayIncrement * 3 + delayIncrement * 2) // 使用节点的 order 属性计算延迟
                .attr("fill-opacity", 1);
        });
}

document.getElementById("startAnimation").addEventListener('click', revealElements);

}


</script>
