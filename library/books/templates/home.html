<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎访问图书馆管理系统</title>
    <!-- 引入 Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- 引入自定义样式 -->
    <style>
        body {
            /* 动态背景颜色动画 */
            animation: gradientBackground 10s infinite alternate;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            background-size: 400% 400%;
            color: #fff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            overflow: hidden; /* 避免流星溢出页面 */
            position: relative;
        }

        @keyframes gradientBackground {
            0% {
                background-position: 0% 50%;
                background-color: #6a11cb;
            }
            50% {
                background-position: 100% 50%;
                background-color: #2575fc;
            }
            100% {
                background-position: 0% 50%;
                background-color: #ff6a00;
            }
        }

        /* 流星雨效果 */
        .meteor {
            position: absolute;
            top: -50px;
            width: 2px;
            height: 10px;
            background: white;
            animation: meteor-shower 2s linear infinite;
        }

        @keyframes meteor-shower {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateX(300px) translateY(500px);
                opacity: 0;
            }
        }

        .hero {
            margin-top: 50px;
            padding: 50px 15px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        }

        .hero h1 {
            font-size: 3.5rem;
            animation: fadeInDown 1s ease-out;
        }

        .hero p {
            animation: fadeIn 2s ease-out;
        }

        .btn-primary, .btn-outline-secondary {
            font-size: 1.2rem;
            padding: 10px 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-primary:hover, .btn-outline-secondary:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        .hero img {
            animation: fadeInUp 2s ease-out;
            margin-top: 30px;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 调整按钮样式 */
        .btn-primary, .btn-outline-secondary {
            font-size: 1.2rem;
            padding: 12px 25px;
        }

        /* 添加流星雨的随机生成 */
        @keyframes generateMeteors {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- 流星雨效果 -->
    <div class="meteor" style="animation-duration: 2s; animation-delay: 0s; left: 10%;"></div>
    <div class="meteor" style="animation-duration: 2s; animation-delay: 1s; left: 25%;"></div>
    <div class="meteor" style="animation-duration: 3s; animation-delay: 1.5s; left: 50%;"></div>
    <div class="meteor" style="animation-duration: 3s; animation-delay: 2s; left: 70%;"></div>
    <div class="meteor" style="animation-duration: 4s; animation-delay: 0.5s; left: 90%;"></div>
    
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="hero text-center">
            <!-- 欢迎标题 -->
            <h1 class="display-4">欢迎访问图书馆管理系统</h1>
            <p class="lead">高效管理书籍与借阅记录，探索您的知识海洋。</p>

            <!-- 导航按钮 -->
            <div class="mt-4">
                <a href="/books/" class="btn btn-primary btn-lg mr-3">进入图书列表</a>
                <a href="/admin/" class="btn btn-outline-secondary btn-lg">进入管理后台</a>
            </div>

        </div>
    </div>

    <!-- 页脚 -->
    <footer class="text-center">
        <p>&copy; 2024 图书馆管理系统 | <a href="mailto:support@example.com" style="color: #fff; text-decoration: underline;">联系我们</a></p>
    </footer>

    <!-- 引入 Bootstrap 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
