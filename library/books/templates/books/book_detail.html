<!-- books/templates/books/book_detail.html -->

{% extends 'books/base.html' %}

{% block title %}书籍详情{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">书籍详情</h3>
    </div>
    <div class="card-body">
        <p><strong>标题：</strong>{{ book.title }}</p>
        <p><strong>作者：</strong>{{ book.author }}</p>
        <p><strong>出版日期：</strong>{{ book.published_date }}</p>
        <p><strong>ISBN：</strong>{{ book.isbn }}</p>
    </div>
    <div class="card-footer">
        <a href="{% url 'book_list' %}" class="btn btn-secondary">返回图书列表</a>
        <a href="{% url 'book_edit' pk=book.pk %}" class="btn btn-warning">编辑</a>
        <a href="{% url 'book_delete' pk=book.pk %}" class="btn btn-danger">删除</a>
    </div>
</div>
{% endblock %}
